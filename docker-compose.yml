name: rag-AI_chat_application

services:
  # MongoDB with mongot (Atlas Vector Search) running locally
  mongodb:
    image: mongodb/mongodb-atlas-local:8.0
    hostname: mongodb
    environment:
      MONGODB_INITDB_ROOT_USERNAME: ${MONGO_USER:-admin}
      MONGODB_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-admin}
    ports:
      - "27017:27017"            # optional: connect with Compass / mongosh
    volumes:
      - mongo_db:/data/db
      - mongo_config:/data/configdb
      - mongo_mongot:/data/mongot
    # the image ships its own HEALTHCHECK
    restart: unless-stopped
    # mongod + mongot can need more than Docker's default 10 s to shut down; being force-killed (exit 137)
    # makes `docker compose up` fail and risks the data
    stop_grace_period: 60s

  # Local LLM server
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"            # optional: talk to Ollama from the host
    volumes:
      - ollama_data:/root/.ollama
    environment:
      OLLAMA_KEEP_ALIVE: 30m
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  # One-shot job: pulls the generation model into the ollama volume, then exits
  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    # pulls the answering model (also used for the pre-judge) and the Contextual Retrieval model
    entrypoint: ["/bin/sh", "-c", "ollama pull ${LLM_MODEL:-qwen3:8b} && ollama pull ${CONTEXT_MODEL:-qwen3:4b-instruct}"]
    restart: "no"

  backend:
    build:
      context: ./backend
    environment:
      MONGO_URI: mongodb://${MONGO_USER:-admin}:${MONGO_PASSWORD:-admin}@mongodb:27017/?directConnection=true
      MONGO_DB: ragdb
      OLLAMA_URL: http://ollama:11434
      LLM_MODEL: ${LLM_MODEL:-qwen3:8b}
      LLM_NUM_CTX: ${LLM_NUM_CTX:-8192}
      LLM_THINK: ${LLM_THINK:-false}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.2}
      LLM_KEEP_ALIVE: ${LLM_KEEP_ALIVE:-30m}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-600}
      LLM_LOAD_TIMEOUT: ${LLM_LOAD_TIMEOUT:-1800}
      CONTEXTUAL_EMBEDDING: ${CONTEXTUAL_EMBEDDING:-true}
      CONTEXT_MODEL: ${CONTEXT_MODEL:-qwen3:4b-instruct}
      CONTEXT_NUM_CTX: ${CONTEXT_NUM_CTX:-16384}
      PREJUDGE_ENABLED: ${PREJUDGE_ENABLED:-true}
      CHUNK_SIZE: ${CHUNK_SIZE:-1000}
      CHUNK_OVERLAP: ${CHUNK_OVERLAP:-150}
      TOP_K: ${TOP_K:-5}
      BM25_CANDIDATES: ${BM25_CANDIDATES:-10}
      VECTOR_MIN_SCORE: ${VECTOR_MIN_SCORE:-0.85}
      VECTOR_CANDIDATES: ${VECTOR_CANDIDATES:-20}
      RRF_K: ${RRF_K:-60}
      RERANKER_ENABLED: ${RERANKER_ENABLED:-true}
      RERANKER_MODEL: ${RERANKER_MODEL:-BAAI/bge-reranker-base}
      RERANK_CANDIDATES: ${RERANK_CANDIDATES:-20}
      HISTORY_TURNS: ${HISTORY_TURNS:-6}
      # Cloud mode (OpenRouter): the key comes from the environment of the shell that starts compose (not from .env)
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      CLOUD_EMBED_MODEL: ${CLOUD_EMBED_MODEL:-google/gemini-embedding-2}
      CLOUD_EMBED_DIM: ${CLOUD_EMBED_DIM:-768}
      CLOUD_VECTOR_MIN_SCORE: ${CLOUD_VECTOR_MIN_SCORE:-0}
      CLOUD_CONTEXT_MODEL: ${CLOUD_CONTEXT_MODEL:-google/gemini-3.5-flash-lite}
      CLOUD_LLM_MODEL: ${CLOUD_LLM_MODEL:-deepseek/deepseek-v4.1-flash}
      CLOUD_PREJUDGE_MODEL: ${CLOUD_PREJUDGE_MODEL:-google/gemini-3.5-flash-lite}
      CLOUD_PREJUDGE_TOP_K: ${CLOUD_PREJUDGE_TOP_K:-15}
      CLOUD_PREJUDGE_BM25_CANDIDATES: ${CLOUD_PREJUDGE_BM25_CANDIDATES:-20}
      CLOUD_PREJUDGE_VECTOR_CANDIDATES: ${CLOUD_PREJUDGE_VECTOR_CANDIDATES:-30}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-25}
      JUDGE_MODEL: ${JUDGE_MODEL:-qwen3:8b}
      EVAL_DIR: /evaluation_metrics
    volumes:
      - app_data:/data
      - ./evaluation_metrics:/evaluation_metrics   # QASPER evaluation: <run-id>.json, result_40.md
    ports:
      - "8000:8000"              # optional: FastAPI docs at http://localhost:8000/docs
    depends_on:
      mongodb:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mongo_db:
  mongo_config:
  mongo_mongot:
  ollama_data:
  app_data:
