name: rag-AI_chat_application

services:
  # MongoDB with mongot (Atlas Vector Search) running locally
  mongodb:
    image: mongodb/mongodb-atlas-local:8.0
    hostname: mongodb
    environment:
      MONGODB_INITDB_ROOT_USERNAME: ${MONGO_USER:-admin}
      MONGODB_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-admin}
    ports:
      - "27017:27017"            # optional: connect with Compass / mongosh
    volumes:
      - mongo_db:/data/db
      - mongo_config:/data/configdb
      - mongo_mongot:/data/mongot
    # the image ships its own HEALTHCHECK
    restart: unless-stopped

  # Local LLM server
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"            # optional: talk to Ollama from the host
    volumes:
      - ollama_data:/root/.ollama
    environment:
      OLLAMA_KEEP_ALIVE: 30m
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  # One-shot job: pulls the generation model into the ollama volume, then exits
  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    # pulls the answering model and the Contextual Retrieval model
    entrypoint: ["/bin/sh", "-c", "ollama pull ${LLM_MODEL:-qwen3:8b} && ollama pull ${CONTEXT_MODEL:-qwen3:4b}"]
    restart: "no"

  backend:
    build:
      context: ./backend
    environment:
      MONGO_URI: mongodb://${MONGO_USER:-admin}:${MONGO_PASSWORD:-admin}@mongodb:27017/?directConnection=true
      MONGO_DB: ragdb
      OLLAMA_URL: http://ollama:11434
      LLM_MODEL: ${LLM_MODEL:-qwen3:8b}
      LLM_NUM_CTX: ${LLM_NUM_CTX:-8192}
      LLM_THINK: ${LLM_THINK:-false}
      LLM_KEEP_ALIVE: ${LLM_KEEP_ALIVE:-30m}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-600}
      LLM_LOAD_TIMEOUT: ${LLM_LOAD_TIMEOUT:-1800}
      CONTEXTUAL_EMBEDDING: ${CONTEXTUAL_EMBEDDING:-true}
      CONTEXT_MODEL: ${CONTEXT_MODEL:-qwen3:4b}
      CONTEXT_NUM_CTX: ${CONTEXT_NUM_CTX:-16384}
      CHUNK_SIZE: ${CHUNK_SIZE:-1000}
      CHUNK_OVERLAP: ${CHUNK_OVERLAP:-150}
      TOP_K: ${TOP_K:-5}
      BM25_CANDIDATES: ${BM25_CANDIDATES:-10}
      VECTOR_MIN_SCORE: ${VECTOR_MIN_SCORE:-0.85}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-25}
      JUDGE_MODEL: ${JUDGE_MODEL:-qwen3:8b}
      EVAL_DIR: /evaluation_metrics
    volumes:
      - app_data:/data
      - ./evaluation_metrics:/evaluation_metrics   # QASPER evaluation: <run-id>.json, results.md
    ports:
      - "8000:8000"              # optional: FastAPI docs at http://localhost:8000/docs
    depends_on:
      mongodb:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mongo_db:
  mongo_config:
  mongo_mongot:
  ollama_data:
  app_data:
